name: Fajr web v2 checks (free, independent)
on:
  pull_request:
    branches:
      - main
      - release/fajr-production-20261030
    paths:
      - 'web-v2/**'
      - '.github/workflows/fajr-web-v2-check.yml'
      - '.github/workflows/testdriver.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fajr-web-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: web-v2/.nvmrc
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: FP-08 verify evidence schema and fail-closed release policy
        run: node tests/fp08-release-gate.mjs
      - name: Run offline-safe intake server/client unit tests
        run: npm run test:intake
      - name: FP-09 compile isolated QA-only Pages Function without deployment
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages functions build qa-only/functions \
            --project-directory . \
            --outfile "$RUNNER_TEMP/fp09-qa-only-worker.mjs"
          test -s "$RUNNER_TEMP/fp09-qa-only-worker.mjs"
          test ! -d functions
          echo "FP09_QA_FUNCTION_BUILD=PASS; NO_RELEASE=ENFORCED"
      - name: Build the static site
        run: npm run build
      - name: Install Chromium for local browser QA
        run: npx playwright install --with-deps chromium
      - name: FP-07 prove four-language service catalog and enquiry context
        working-directory: web-v2
        run: node tests/service-catalog-qa.mjs
      - name: Verify website UX with local browser and synthetic data
        run: npm run test:smoke
      - name: Verify crawlable inbound HTML and local Pages routing (no deploy)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run test:seo
      - name: Verify optional intake form with intercepted API and synthetic challenge
        run: npm run test:intake-form
      - name: Save synthetic inbound visual QA for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fajr-pr17-inbound-visual-qa
          path: |
            web-v2/test-results/inbound-*.png
            web-v2/test-results/results.json
            web-v2/test-results/inbound-seo-results.json
            web-v2/test-results/inbound-response.html
            web-v2/test-results/inbound-pages.log
            web-v2/test-results/intake-form-results.json
            web-v2/test-results/fp09-receipt-mobile.png
          if-no-files-found: error
          retention-days: 3
