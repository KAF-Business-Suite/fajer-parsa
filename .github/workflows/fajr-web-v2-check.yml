name: Fajr web v2 checks
on:
  pull_request:
    paths:
      - 'web-v2/**'
      - 'docs/proposals/FAJR_OFFICE_UNAPPLIED.sql'
      - '.github/workflows/fajr-web-v2-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fajr-web-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: web-v2/.nvmrc
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:intake
      - run: npm run test:office
      - run: npm run typecheck:office
      - run: npx playwright install --with-deps chromium
      - run: node tests/office-preview.mjs
      - run: npm run build

  office-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: fajr_office_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: web-v2/.nvmrc
      - run: npm run test:office:postgres
        env:
          OFFICE_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/fajr_office_test
