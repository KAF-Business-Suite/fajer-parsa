name: Fajr Parsa | safe Pages release
on:
  pull_request:
    branches:
      - main
      - release/fajr-production-20261030
  push:
    branches:
      - main
    paths:
      - 'web-v2/**'
      - '.github/workflows/fajr-pages-safe-release.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Verify checks Cloudflare credentials READ-ONLY, with no Pages deployment'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - preview
          - production
      confirmation:
        description: 'Production only: type DEPLOY-FAJR-PRODUCTION'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: fajr-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use the pinned application Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: web-v2/.nvmrc
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - name: R1 credential presence check (never prints values)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          ACCOUNT_ID_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          API_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          for secret in ACCOUNT_ID API_TOKEN; do
            name=ACCOUNT_ID_PRESENT
            if [[ "$secret" == API_TOKEN ]]; then name=API_TOKEN_PRESENT; fi
            if [[ "${!name}" == true ]]; then
              echo "FAJR_R1_${secret}=PRESENT"
            else
              echo "FAJR_R1_${secret}=MISSING_OR_UNAVAILABLE"
              echo "::warning::R1 ${secret} unavailable in this PR context; no deployment attempted."
            fi
          done
          echo "FAJR_R1_NO_DEPLOY=ENFORCED"
      - name: Install exactly the locked dependencies
        working-directory: web-v2
        run: npm ci --no-audit --no-fund
      - name: Test intake in isolation
        working-directory: web-v2
        run: npm run test:intake
      - name: Build the exact application
        working-directory: web-v2
        run: npm run build
      - name: Install Chromium for free browser QA
        working-directory: web-v2
        run: npx playwright install --with-deps chromium
      - name: Verify production UI with local Chromium
        working-directory: web-v2
        run: npm run test:smoke
      - name: Verify crawlable inbound HTML and local Pages routing (no deploy)
        working-directory: web-v2
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run test:seo
      - name: Verify optional synthetic intake without live submission
        working-directory: web-v2
        run: npm run test:intake-form
      - name: Verify Pages CLI supports intended flags without deployment
        working-directory: web-v2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy --help > "$RUNNER_TEMP/fajr-wrangler-help.txt"
          grep -Fq -- '--project-name' "$RUNNER_TEMP/fajr-wrangler-help.txt"
          grep -Fq -- '--branch' "$RUNNER_TEMP/fajr-wrangler-help.txt"
          grep -Fq -- '--commit-hash' "$RUNNER_TEMP/fajr-wrangler-help.txt"
      - name: Validate static-only build output
        shell: bash
        run: |
          set -euo pipefail
          test -s web-v2/dist/index.html
          if [[ -e web-v2/dist/_worker.js || -e web-v2/dist/_routes.json || -d web-v2/functions ]]; then
            echo "::error::Unexpected Pages Functions or Worker artifacts. Review before release."
            exit 1
          fi
      - name: Choose release safely (default is OFF)
        id: policy
        shell: bash
        env:
          AUTO_DEPLOY: ${{ vars.FAJR_AUTO_DEPLOY }}
          RELEASE_ARMED: ${{ vars.FAJR_RELEASE_ARMED }}
          TARGET: ${{ inputs.target }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          deploy=none
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$AUTO_DEPLOY" == enabled && "$RELEASE_ARMED" == verified-after-first-manual-release ]]; then
            deploy=production
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$TARGET" == verify ]]; then
              echo "FP08_AUTH_ONLY_NO_DEPLOY=ENFORCED"
              deploy=none
            elif [[ "$TARGET" == preview ]]; then
              deploy=preview
            elif [[ "$TARGET" == production && "$GITHUB_REF" == refs/heads/main && "$CONFIRMATION" == DEPLOY-FAJR-PRODUCTION ]]; then
              deploy=production
            else
              echo "::error::Production requires the main branch and exact confirmation."
              exit 1
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Selected release: $deploy"
      - name: Check credentials and block stale production sources
        # Manual verify invokes read-only token and exact project GET; the deploy step stays gated on deploy != none.
        if: steps.policy.outputs.deploy != 'none' || (github.event_name == 'workflow_dispatch' && inputs.target == 'verify')
        id: guard
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TARGET: ${{ steps.policy.outputs.deploy }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions secrets."
            exit 1
          fi
          # FP-08: fail closed before any upload if stored credentials are malformed.
          # Do not log token values. All checks below are Cloudflare read-only GETs.
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal ID. Correct the GitHub Secret privately."
            exit 1
          fi
          case "$CLOUDFLARE_API_TOKEN" in
            *[[:space:]]*|Bearer*|bearer*|*\"*|*\'*)
              echo "::error::CLOUDFLARE_API_TOKEN format is invalid. Store the raw token only: no Bearer prefix, quotes, or whitespace."
              exit 1
              ;;
          esac
          verification_file="$RUNNER_TEMP/fajr-cloudflare-token-verify.json"
          if ! curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o "$verification_file" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"; then
            echo "::error::Cloudflare rejected the API token. Check validity and format privately; no deploy attempted."
            exit 1
          fi
          if [[ "$(jq -r '.success == true and .result.status == "active"' "$verification_file")" != true ]]; then
            echo "::error::Cloudflare API token is not verified active. No deploy attempted."
            exit 1
          fi
          project_file="$RUNNER_TEMP/fajr-cloudflare-project-check.json"
          if ! curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o "$project_file" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fajr-parsa-qa"; then
            echo "::error::Cloudflare token cannot read existing fajr-parsa-qa project. Check Pages permission/account scope privately."
            exit 1
          fi
          if [[ "$(jq -r '.success == true and .result.name == "fajr-parsa-qa"' "$project_file")" != true ]]; then
            echo "::error::Cloudflare did not confirm existing target Pages project. No deploy attempted."
            exit 1
          fi
          echo "FP08_CLOUDFLARE_AUTH_READONLY_PASS (no credential values logged)"
          if [[ "$RELEASE_TARGET" == production ]]; then
            baseline=94891bba02354fef36a6af292de9435872568c02
            if ! git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"; then
              echo "::error::Git main does not contain the preserved live Fajr baseline. Refusing release."
              exit 1
            fi
            response="$(curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fajr-parsa-qa/deployments?env=production&per_page=1")"
            current="$(printf '%s' "$response" | jq -r '.result[0].deployment_trigger.metadata.commit_hash // empty')"
            status="$(printf '%s' "$response" | jq -r '.result[0].latest_stage.status // empty')"
            if [[ ! "$current" =~ ^[0-9a-f]{40}$ || "$status" != success ]]; then
              echo "::error::Could not verify the latest successful Cloudflare production SHA."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
              echo "::error::Cloudflare production has an unrelated or newer source. Manual review required."
              exit 1
            fi
            if [[ "$current" == "$GITHUB_SHA" ]]; then
              echo "already_live=true" >> "$GITHUB_OUTPUT"
              echo "Current commit is already live; no duplicate deployment."
            fi
          fi
      - name: Deploy to the existing Pages project
        if: steps.policy.outputs.deploy != 'none' && steps.guard.outputs.already_live != 'true'
        working-directory: web-v2
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TARGET: ${{ steps.policy.outputs.deploy }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TARGET" == production ]]; then
            branch=main
          else
            branch=fajr-ci-preview
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name=fajr-parsa-qa \
            --branch="$branch" \
            --commit-hash="$GITHUB_SHA"

      # FP-INTAKE-01: only the owner-owned review PR #22 may publish a disabled,
      # fail-closed Pages Function to a non-main branch in the SAME Pages project.
      # This does not read any customer secrets or enable public customer intake.
      - name: "FP-INTAKE-01: deploy disabled QA HTTP route to isolated branch"
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 22 && github.event.pull_request.head.ref == 'work/fp-intake-01-preview-http-contract-20261114' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' }}
        working-directory: web-v2
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "22"
          test "${{ github.event.pull_request.head.ref }}" = "work/fp-intake-01-preview-http-contract-20261114"
          test -s dist/index.html
          test ! -e dist/_worker.js
          test ! -e dist/_routes.json
          test ! -d functions
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Preview deployment requires pre-existing Cloudflare GitHub secrets."
            exit 1
          fi
          verification_file="$RUNNER_TEMP/fajr-intake-token-check.json"
          project_file="$RUNNER_TEMP/fajr-intake-project-check.json"
          curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "$verification_file" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"
          test "$(jq -r '.success == true and .result.status == "active"' "$verification_file")" = true
          curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "$project_file" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fajr-parsa-qa"
          test "$(jq -r '.success == true and .result.name == "fajr-parsa-qa" and .result.production_branch == "main"' "$project_file")" = true
          before_production="$(jq -r '.result.canonical_deployment.id // empty' "$project_file")"
          before_sha="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty' "$project_file")"
          test -n "$before_production"
          test -n "$before_sha"
          # Source stays in web-v2/server/intake. Bundle only in this transient CI job.
          mkdir -p functions/api
          node --input-type=module -e 'import {build} from "esbuild"; await build({entryPoints:["server/intake/pages-entry.ts"],bundle:true,platform:"browser",format:"esm",target:"es2022",outfile:"functions/api/requests.js",logLevel:"error"})'
          test -s functions/api/requests.js
          echo "FP_INTAKE_PREVIEW_BUILD=PASS; customer intake must remain disabled."
          # The existing project uses main as its production branch. Never pass main here.
          npx --yes wrangler@4 pages deploy dist \
            --project-name=fajr-parsa-qa \
            --branch=fp-intake-safe-review \
            --commit-hash="${{ github.event.pull_request.head.sha }}"
          url="https://fp-intake-safe-review.fajr-parsa-qa.pages.dev/api/requests"
          check=0
          for attempt in $(seq 1 16); do
            status="$(curl -sS --max-time 12 -o "$RUNNER_TEMP/fajr-intake-response.json" -w '%{http_code}' "$url" || true)"
            if [[ "$status" == "503" ]] && jq -e '.error == "intake_not_enabled"' "$RUNNER_TEMP/fajr-intake-response.json" >/dev/null 2>&1; then
              check=1
              break
            fi
            sleep 3
          done
          if [[ "$check" != 1 ]]; then
            echo "::error::Remote preview did not fail closed as expected. No production deployment attempted."
            exit 1
          fi
          curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "$project_file" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fajr-parsa-qa"
          after_production="$(jq -r '.result.canonical_deployment.id // empty' "$project_file")"
          after_sha="$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // empty' "$project_file")"
          if [[ "$before_production" != "$after_production" || "$before_sha" != "$after_sha" ]]; then
            echo "::error::Canonical production deployment changed unexpectedly."
            exit 1
          fi
          echo "FP_INTAKE_REMOTE_PREVIEW_HTTP=PASS"
          echo "FP_INTAKE_REMOTE_PREVIEW_FAIL_CLOSED=503"
          echo "FP_INTAKE_PRODUCTION_UNCHANGED=PASS"
          echo "FP_INTAKE_CUSTOMER_SUBMISSIONS=OFF"
