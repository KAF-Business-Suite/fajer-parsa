name: Fajr Parsa | safe Pages release
on:
  pull_request:
    branches:
      - main
      - release/fajr-production-20261030
  push:
    branches:
      - main
    paths:
      - 'web-v2/**'
      - '.github/workflows/fajr-pages-safe-release.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Verify checks Cloudflare credentials READ-ONLY, with no Pages deployment'
        type: choice
        required: true
        default: verify
        options:
          - verify
          - preview
          - production
      confirmation:
        description: 'Production only: type DEPLOY-FAJR-PRODUCTION'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: fajr-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use the pinned application Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: web-v2/.nvmrc
          cache: npm
          cache-dependency-path: web-v2/package-lock.json
      - name: R1 credential presence check (never prints values)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          ACCOUNT_ID_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          API_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          for secret in ACCOUNT_ID API_TOKEN; do
            name=ACCOUNT_ID_PRESENT
            if [[ "$secret" == API_TOKEN ]]; then name=API_TOKEN_PRESENT; fi
            if [[ "${!name}" == true ]]; then
              echo "FAJR_R1_${secret}=PRESENT"
            else
              echo "FAJR_R1_${secret}=MISSING_OR_UNAVAILABLE"
              echo "::warning::R1 ${secret} unavailable in this PR context; no deployment attempted."
            fi
          done
          echo "FAJR_R1_NO_DEPLOY=ENFORCED"
      - name: Install exactly the locked dependencies
        working-directory: web-v2
        run: npm ci --no-audit --no-fund
      - name: FP-08 verify evidence schema and fail-closed release policy
        working-directory: web-v2
        run: node tests/fp08-release-gate.mjs
      - name: Verify public-only site settings schema (no service secrets)
        working-directory: web-v2
        run: npm run test:site-settings
      - name: Test intake in isolation
        working-directory: web-v2
        run: npm run test:intake
      - name: Build the exact application
        working-directory: web-v2
        run: npm run build
      - name: Install Chromium for free browser QA
        working-directory: web-v2
        run: npx playwright install --with-deps chromium
      - name: FP-07 prove four-language service catalog and enquiry context
        working-directory: web-v2
        run: node tests/service-catalog-qa.mjs
      - name: Verify production UI with local Chromium
        working-directory: web-v2
        run: npm run test:smoke
      - name: Verify crawlable inbound HTML and local Pages routing (no deploy)
        working-directory: web-v2
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run test:seo
      - name: Verify optional synthetic intake without live submission
        working-directory: web-v2
        run: npm run test:intake-form
      - name: Verify Pages CLI supports intended flags without deployment
        working-directory: web-v2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy --help > "$RUNNER_TEMP/fajr-wrangler-help.txt"
          grep -Fq -- '--project-name' "$RUNNER_TEMP/fajr-wrangler-help.txt"
          grep -Fq -- '--branch' "$RUNNER_TEMP/fajr-wrangler-help.txt"
          grep -Fq -- '--commit-hash' "$RUNNER_TEMP/fajr-wrangler-help.txt"
      - name: Validate static-only build output
        shell: bash
        run: |
          set -euo pipefail
          test -s web-v2/dist/index.html
          if [[ -e web-v2/dist/_worker.js || -e web-v2/dist/_routes.json || -d web-v2/functions ]]; then
            echo "::error::Unexpected Pages Functions or Worker artifacts. Review before release."
            exit 1
          fi
      - name: Choose release safely (default is OFF)
        id: policy
        shell: bash
        env:
          AUTO_DEPLOY: ${{ vars.FAJR_AUTO_DEPLOY }}
          RELEASE_ARMED: ${{ vars.FAJR_RELEASE_ARMED }}
          TARGET: ${{ inputs.target }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          deploy=none
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$AUTO_DEPLOY" == enabled && "$RELEASE_ARMED" == verified-after-first-manual-release ]]; then
            deploy=production
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$TARGET" == verify ]]; then
              echo "FP08_AUTH_ONLY_NO_DEPLOY=ENFORCED"
              deploy=none
            elif [[ "$TARGET" == preview ]]; then
              deploy=preview
            elif [[ "$TARGET" == production && "$GITHUB_REF" == refs/heads/main && "$CONFIRMATION" == DEPLOY-FAJR-PRODUCTION ]]; then
              deploy=production
            else
              echo "::error::Production requires the main branch and exact confirmation."
              exit 1
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Selected release: $deploy"
      - name: FP-08 block production until owner-approved legal and service evidence
        if: steps.policy.outputs.deploy == 'production'
        working-directory: web-v2
        run: node scripts/fp08-release-gate.mjs production
      - name: Check credentials and block stale production sources
        # Manual verify invokes read-only token and exact project GET; the deploy step stays gated on deploy != none.
        if: steps.policy.outputs.deploy != 'none' || (github.event_name == 'workflow_dispatch' && inputs.target == 'verify')
        id: guard
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TARGET: ${{ steps.policy.outputs.deploy }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions secrets."
            exit 1
          fi
          # FP-08: fail closed before any upload if stored credentials are malformed.
          # Do not log token values. All checks below are Cloudflare read-only GETs.
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal ID. Correct the GitHub Secret privately."
            exit 1
          fi
          case "$CLOUDFLARE_API_TOKEN" in
            *[[:space:]]*|Bearer*|bearer*|*\"*|*\'*)
              echo "::error::CLOUDFLARE_API_TOKEN format is invalid. Store the raw token only: no Bearer prefix, quotes, or whitespace."
              exit 1
              ;;
          esac
          verification_file="$RUNNER_TEMP/fajr-cloudflare-token-verify.json"
          if ! curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o "$verification_file" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"; then
            echo "::error::Cloudflare rejected the API token. Check validity and format privately; no deploy attempted."
            exit 1
          fi
          if [[ "$(jq -r '.success == true and .result.status == "active"' "$verification_file")" != true ]]; then
            echo "::error::Cloudflare API token is not verified active. No deploy attempted."
            exit 1
          fi
          project_file="$RUNNER_TEMP/fajr-cloudflare-project-check.json"
          if ! curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o "$project_file" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fajr-parsa-qa"; then
            echo "::error::Cloudflare token cannot read existing fajr-parsa-qa project. Check Pages permission/account scope privately."
            exit 1
          fi
          if [[ "$(jq -r '.success == true and .result.name == "fajr-parsa-qa"' "$project_file")" != true ]]; then
            echo "::error::Cloudflare did not confirm existing target Pages project. No deploy attempted."
            exit 1
          fi
          echo "FP08_CLOUDFLARE_AUTH_READONLY_PASS (no credential values logged)"
          if [[ "$RELEASE_TARGET" == production ]]; then
            baseline=94891bba02354fef36a6af292de9435872568c02
            if ! git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"; then
              echo "::error::Git main does not contain the preserved live Fajr baseline. Refusing release."
              exit 1
            fi
            response="$(curl --fail-with-body --silent --show-error --max-time 20 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fajr-parsa-qa/deployments?env=production&per_page=1")"
            current="$(printf '%s' "$response" | jq -r '.result[0].deployment_trigger.metadata.commit_hash // empty')"
            status="$(printf '%s' "$response" | jq -r '.result[0].latest_stage.status // empty')"
            if [[ ! "$current" =~ ^[0-9a-f]{40}$ || "$status" != success ]]; then
              echo "::error::Could not verify the latest successful Cloudflare production SHA."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
              echo "::error::Cloudflare production has an unrelated or newer source. Manual review required."
              exit 1
            fi
            if [[ "$current" == "$GITHUB_SHA" ]]; then
              echo "already_live=true" >> "$GITHUB_OUTPUT"
              echo "Current commit is already live; no duplicate deployment."
            fi
          fi
      - name: Deploy to the existing Pages project
        if: steps.policy.outputs.deploy != 'none' && steps.guard.outputs.already_live != 'true'
        working-directory: web-v2
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_TARGET: ${{ steps.policy.outputs.deploy }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TARGET" == production ]]; then
            branch=main
          else
            branch=fajr-ci-preview
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name=fajr-parsa-qa \
            --branch="$branch" \
            --commit-hash="$GITHUB_SHA"

      - name: FP-07 publish protected synthetic service-guide preview
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 24 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'work/fp07-service-trust-catalog-20261115' && github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: web-v2
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          test -s dist/index.html
          test "${{ github.event.pull_request.number }}" = "24"
          test "${{ github.event.pull_request.head.ref }}" = "work/fp07-service-trust-catalog-20261115"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          response="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fajr-parsa-qa")"
          test "$(printf '%s' "$response" | jq -r '.success == true and .result.name == "fajr-parsa-qa"')" = true
          # Existing Cloudflare Pages project, non-production branch, exact tested commit.
          npx --yes wrangler@4 pages deploy dist \
            --project-name=fajr-parsa-qa \
            --branch=fp07-service-catalog-preview \
            --commit-hash="$GITHUB_SHA"
          echo "FP07_PREVIEW_ONLY=PASS; PRODUCTION_UNCHANGED_BY_POLICY"

      - name: FP-09 publish isolated synthetic-only QA intake to existing Pages alias
        # Only this Draft PR. The public widget key is safe to embed in browser code.
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 24 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'work/fp07-service-trust-catalog-20261115' && github.event.pull_request.head.repo.full_name == github.repository }}
        working-directory: web-v2
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_FAJR_INTAKE_ENABLED: "true"
          VITE_FAJR_QA_SYNTHETIC_ONLY: "true"
          VITE_FAJR_TURNSTILE_SITEKEY: "0x4AAAAAAFrqV6izkeFDGOwS"
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "${{ github.event.pull_request.number }}" = "24"
          test "${{ github.event.pull_request.head.ref }}" = "work/fp07-service-trust-catalog-20261115"
          test "${{ github.event.pull_request.base.ref }}" = main
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          test -f qa-only/functions/api/requests.ts
          test ! -d functions
          test ! -f dist/_worker.js
          # Standard CI tested the default-disabled public build.
          # Rebuild only for existing isolated QA alias with synthetic-only form.
          npm run build
          test -s dist/index.html
          mkdir -p functions/api
          cp qa-only/functions/api/requests.ts functions/api/requests.ts
          test "$(find functions -type f | wc -l)" -eq 1
          npx --yes wrangler@4 pages functions build functions --project-directory . --outfile "$RUNNER_TEMP/fp09-qa-only-bundle.mjs"
          test -s "$RUNNER_TEMP/fp09-qa-only-bundle.mjs"
          npx --yes wrangler@4 pages deploy dist \
            --project-name=fajr-parsa-qa \
            --branch=fp-intake-safe-review \
            --commit-hash="$GITHUB_SHA"
          # Prove real HTTP reachability and fail-closed behavior from the CI runner.
          # No valid Turnstile token, customer data, privileged credential or DB write is used.
          QA_ORIGIN="https://fp-intake-safe-review.fajr-parsa-qa.pages.dev"
          page_code="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/fp09-page.html" --write-out '%{http_code}' "$QA_ORIGIN/?lang=fa")"
          test "$page_code" = 200
          test -s "$RUNNER_TEMP/fp09-page.html"
          reject_code="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/fp09-host-denied.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header 'Origin: https://fp07-service-catalog-preview.fajr-parsa-qa.pages.dev' \
            --data '{"requestId":"d5072836-0d50-4dfa-88dc-596e9befd276","contact":"qa-ci@example.invalid","consent":true}' \
            "$QA_ORIGIN/api/requests")"
          test "$reject_code" = 503
          jq -e '.error == "intake_not_enabled"' "$RUNNER_TEMP/fp09-host-denied.json"
          reject_code="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/fp09-real-contact-denied.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header "Origin: $QA_ORIGIN" \
            --data '{"requestId":"d5072836-0d50-4dfa-88dc-596e9befd276","contact":"example@example.com","consent":true}' \
            "$QA_ORIGIN/api/requests")"
          test "$reject_code" = 400
          jq -e '.error == "qa_synthetic_contact_required"' "$RUNNER_TEMP/fp09-real-contact-denied.json"
          # Valid structure, synthetic contact, intentionally invalid challenge:
          # confirms real Pages -> existing Supabase Edge enforcement without saving a request.
          reject_code="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/fp09-invalid-challenge-denied.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header "Origin: $QA_ORIGIN" \
            --data '{"requestId":"d5072836-0d50-4dfa-88dc-596e9befd276","service":"ویزا و اقامت","destination":"امارات","variant":"QA","contact":"qa-ci@example.invalid","consent":true,"challenge":"invalid-ci-only-token","website":""}' \
            "$QA_ORIGIN/api/requests")"
          test "$reject_code" = 403
          jq -e '.error == "challenge_failed"' "$RUNNER_TEMP/fp09-invalid-challenge-denied.json"
          rm -rf functions
          echo "FP09_SYNTHETIC_QA_PAGES_DEPLOYED_AND_HTTP_DENIALS=PASS; NOT_PRODUCTION; NO_NEW_SECRETS"
