# Optional manual-only legacy test. This test targets an older site and
# cannot be used as an acceptance gate for the current Cloudflare production.
# TestDriver's free 30-minute quota was exhausted on run 40954168123;
# do not trigger paid services automatically or request an upgrade.
name: TestDriver.ai (manual legacy, not release gate)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  legacy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Authenticate only on manual request
        uses: testdriverai/action@canary
        with:
          channel: canary
          api-key: ${{ secrets.TD_API_KEY }}
      - name: Run legacy TestDriver case only
        run: npx vitest run tests/fajer-parsa.test.js
      - name: Upload logs if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
